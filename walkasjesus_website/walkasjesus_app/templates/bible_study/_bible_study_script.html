{% load i18n %}
{% load bible_extras %}
{% load static %}
<script>
(function($) {
  'use strict';

  var selectedBibleIds = [{% for bid in selected_bible_ids %}'{{ bid|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}];
  var originalOptionsById = {};
  var bibleStudyRequestCache = {};
  var bsChapterMetaCache = {};
  var bsChapterMetaPending = {};
  var bsAutoApplyTimer = null;
  var bsSuppressAutoApply = true;
  var bsOriginalOpenVerses = {};
  var bsPendingStrongsSelection = null;
  var bsPendingAlignedSelection = null;
  var bibleStudyAlignmentCache = {};
  var bsCopySelection = null;
  var bsLastWordSearch = null;
  var bsCombineVerses = false;

  var originalPanels = window.WAJBibleStudyPanels.create($('.bible-study-shell'), {
    getState: currentBibleStudyState,
    bookLabel: bibleStudyBookLabel,
    fetchVerses: fetchBibleStudyRange,
    jumpReference: jumpToBibleStudyReference,
    syncAlignedSelection: syncBibleStudyAlignedSelection,
    syncAlignedHover: syncBibleStudyAlignedHover,
    afterVerse: function(verse, payload) {
      applyPendingStrongsSelectionToVerse(verse, payload);
      applyPendingAlignedSelectionToVerse(verse);
    }
  });
  var bibleStudyOriginalPanelsHtml = originalPanels.bibleStudyOriginalPanelsHtml;
  var applyBibleStudyOriginalPayloadToDom = originalPanels.applyBibleStudyOriginalPayloadToDom;
  var fetchBibleStudyOriginalRange = originalPanels.fetchBibleStudyOriginalRange;
  var selectBibleStudyOriginalWord = originalPanels.selectBibleStudyOriginalWord;
  var syncOriginalSentenceHover = originalPanels.syncOriginalSentenceHover;
  var normalizeBibleStudyStrongsCode = originalPanels.normalizeBibleStudyStrongsCode;
  var parseBibleStudyDeeplinkReference = originalPanels.parseBibleStudyDeeplinkReference;

  // ---- Smart passage search data ----
  var bsBookList = [{% for book_name, book_label in bible_books %}{'n':'{{ book_name }}','l':'{{ book_label|escapejs }}'}{% if not forloop.last %},{% endif %}{% endfor %}];
  var bsMaxVersesConst = {{ max_verses }};
  var bsSearchBookMeta = {
    Genesis: ['GEN', 50, 26], Exodus: ['EXO', 40, 38], Leviticus: ['LEV', 27, 34], Numbers: ['NUM', 36, 13], Deuteronomy: ['DEU', 34, 12],
    Joshua: ['JOS', 24, 33], Judges: ['JDG', 21, 25], Ruth: ['RUT', 4, 22], SamuelFirstBook: ['1SA', 31, 13], SamuelSecondBook: ['2SA', 24, 25],
    KingsFirstBook: ['1KI', 22, 53], KingsSecondBook: ['2KI', 25, 30], ChroniclesFirstBook: ['1CH', 29, 30], ChroniclesSecondBook: ['2CH', 36, 23],
    Ezra: ['EZR', 10, 44], Nehemiah: ['NEH', 13, 31], Esther: ['EST', 10, 3], Job: ['JOB', 42, 17], Psalms: ['PSA', 150, 6], Proverbs: ['PRO', 31, 31],
    Ecclesiastes: ['ECC', 12, 14], SongOfSolomon: ['SNG', 8, 14], Isaiah: ['ISA', 66, 24], Jeremiah: ['JER', 52, 34], Lamentations: ['LAM', 5, 22],
    Ezekiel: ['EZK', 48, 35], Daniel: ['DAN', 12, 13], Hosea: ['HOS', 14, 9], Joel: ['JOL', 3, 21], Amos: ['AMO', 9, 15], Obadiah: ['OBA', 1, 21],
    Jonah: ['JON', 4, 11], Micah: ['MIC', 7, 20], Nahum: ['NAM', 3, 19], Habakkuk: ['HAB', 3, 19], Zephaniah: ['ZEP', 3, 20],
    Haggai: ['HAG', 2, 23], Zechariah: ['ZEC', 14, 21], Malachi: ['MAL', 4, 6], Matthew: ['MAT', 28, 20], Mark: ['MRK', 16, 20],
    Luke: ['LUK', 24, 53], John: ['JHN', 21, 25], Acts: ['ACT', 28, 31], Romans: ['ROM', 16, 27], CorinthiansFirstBook: ['1CO', 16, 24],
    CorinthiansSecondBook: ['2CO', 13, 14], Galatians: ['GAL', 6, 18], Ephesians: ['EPH', 6, 24], Philippians: ['PHP', 4, 23], Colossians: ['COL', 4, 18],
    ThessaloniansFirstBook: ['1TH', 5, 28], ThessaloniansSecondBook: ['2TH', 3, 18], TimothyFirstBook: ['1TI', 6, 21], TimothySecondBook: ['2TI', 4, 22],
    Titus: ['TIT', 3, 15], Philemon: ['PHM', 1, 25], Hebrews: ['HEB', 13, 25], James: ['JAS', 5, 20], PeterFirstBook: ['1PE', 5, 14],
    PeterSecondBook: ['2PE', 3, 18], JohnFirstBook: ['1JN', 5, 21], JohnSecondBook: ['2JN', 1, 13], JohnThirdBook: ['3JN', 1, 14], Jude: ['JUD', 1, 25], Revelation: ['REV', 22, 21]
  };
  var bsSearchScopeRanges = {
    whole: ['Genesis', 'Revelation'], ot: ['Genesis', 'Malachi'], nt: ['Matthew', 'Revelation'], torah: ['Genesis', 'Deuteronomy'],
    prophets: ['Joshua', 'Malachi'], writings: ['Psalms', 'SongOfSolomon'], gospels: ['Matthew', 'John'], pauline: ['Romans', 'Philemon'], general: ['Hebrews', 'Jude']
  };

  function bsNormalizeQ(q) { return String(q || '').trim().toLowerCase(); }

  // The passage input displays ranges with an en dash (e.g. "John 2:3\u20136"); normalize
  // en/em dashes back to a plain hyphen so edited text keeps matching the range regexes.
  function bsNormalizeDashInput(text) {
    return String(text || '').replace(/[\u2012\u2013\u2014\u2015]/g, '-');
  }

  function bibleStudyChapterMetaUrl() {
    return String($('.bible-study-shell').data('chapter-meta-url') || '').trim();
  }

  function bsMetaBibleId() {
    var selected = '';
    $('.bs-bible-selector-col:visible .bs-bible-select').each(function() {
      var val = String($(this).val() || '').trim();
      if (val) {
        selected = val;
        return false;
      }
      return undefined;
    });
    return selected;
  }

  function bsMetaCacheKey(bookName, chapter, bibleId) {
    return [String(bookName || ''), String(chapter || ''), String(bibleId || '')].join('|');
  }

  function bsResolveChapterMax(bookName, chapter, bibleId) {
    var key = bsMetaCacheKey(bookName, chapter, bibleId);
    return Object.prototype.hasOwnProperty.call(bsChapterMetaCache, key) ? bsChapterMetaCache[key] : null;
  }

  function bsFetchChapterMax(bookName, chapter, bibleId, onDone) {
    var endpoint = bibleStudyChapterMetaUrl();
    if (!endpoint || !bookName || !chapter) {
      if (onDone) { onDone(null); }
      return;
    }

    var key = bsMetaCacheKey(bookName, chapter, bibleId);
    if (Object.prototype.hasOwnProperty.call(bsChapterMetaCache, key)) {
      if (onDone) { onDone(bsChapterMetaCache[key]); }
      return;
    }
    if (bsChapterMetaPending[key]) {
      bsChapterMetaPending[key].push(onDone);
      return;
    }

    bsChapterMetaPending[key] = [onDone];
    $.ajax({
      type: 'GET',
      url: endpoint,
      dataType: 'json',
      data: {
        book: bookName,
        chapter: chapter,
        bible_id: bibleId
      }
    }).done(function(payload) {
      var maxVerse = parseInt((payload && payload.max_verse) || 0, 10);
      bsChapterMetaCache[key] = maxVerse;
      var callbacks = bsChapterMetaPending[key] || [];
      delete bsChapterMetaPending[key];
      callbacks.forEach(function(cb) {
        if (typeof cb === 'function') {
          cb(maxVerse > 0 ? maxVerse : null);
        }
      });
    }).fail(function() {
      (bsChapterMetaPending[key] || []).forEach(function(cb) {
        if (typeof cb === 'function') {
          cb(null);
        }
      });
      delete bsChapterMetaPending[key];
    });
  }

  function bsMatchBooks(query) {
    var q = bsNormalizeQ(query);
    if (!q) return [];
    return bsBookList.filter(function(b) {
      return bsNormalizeQ(b.l).indexOf(q) === 0 || bsNormalizeQ(b.n).indexOf(q) === 0;
    });
  }

  function bsGenerateSuggestions(rawInput) {
    var text = $.trim(bsNormalizeDashInput(rawInput));
    if (!text) return [];
    var suggestions = [];
    var preferredBibleId = bsMetaBibleId();

    // Stage 3: book chapter:startVerse[-endVerse]
    var matchVerse = text.match(/^(.*?)\s+(\d+):(\d+)(?:\s*-\s*(\d+))?\s*$/);
    if (matchVerse) {
      var bookQuery = $.trim(matchVerse[1]);
      var chapter = parseInt(matchVerse[2], 10);
      var typedVerseToken = String(matchVerse[3] || '').trim();
      var startVerse = parseInt(matchVerse[3], 10);
      var rawEnd = matchVerse[4] ? parseInt(matchVerse[4], 10) : startVerse + bsMaxVersesConst - 1;
      bsMatchBooks(bookQuery).slice(0, 3).forEach(function(book) {
        var chapterMax = bsResolveChapterMax(book.n, chapter, preferredBibleId);
        if (chapterMax === null) {
          bsFetchChapterMax(book.n, chapter, preferredBibleId, function() {
            var currentInput = $.trim($('#bs-passage-input').val());
            if (currentInput) {
              bsRenderSuggestions(bsGenerateSuggestions(currentInput));
            }
          });
          return;
        }
        if (startVerse > chapterMax) {
          return;
        }

        if (matchVerse[4]) {
          var maxByRange = startVerse + bsMaxVersesConst - 1;
          var effectiveEnd = Math.min(rawEnd, maxByRange, chapterMax || maxByRange);
          var capped = rawEnd > effectiveEnd;
          var lbl = book.l + ' ' + chapter + ':' + startVerse + '\u2013' + effectiveEnd;
          if (capped) { lbl += ' (max ' + bsMaxVersesConst + ' {% trans "verses" %})'; }
          suggestions.push({ label: lbl, bookName: book.n, bookLabel: book.l,
            chapter: chapter, startVerse: startVerse, endVerse: effectiveEnd, autoSubmit: true });
          return;
        }

        for (var vv = 1; vv <= chapterMax && suggestions.length < 8; vv += 1) {
          if (String(vv).indexOf(typedVerseToken) !== 0) {
            continue;
          }
          var effectiveEndPrefix = Math.min(vv + bsMaxVersesConst - 1, chapterMax);
          suggestions.push({
            label: book.l + ' ' + chapter + ':' + vv + '\u2013' + effectiveEndPrefix,
            bookName: book.n,
            bookLabel: book.l,
            chapter: chapter,
            startVerse: vv,
            endVerse: effectiveEndPrefix,
            autoSubmit: true
          });
        }

        if (!suggestions.length) {
          var fallbackEnd = Math.min(startVerse + bsMaxVersesConst - 1, chapterMax || (startVerse + bsMaxVersesConst - 1));
          suggestions.push({
            label: book.l + ' ' + chapter + ':' + startVerse + '\u2013' + fallbackEnd,
            bookName: book.n,
            bookLabel: book.l,
            chapter: chapter,
            startVerse: startVerse,
            endVerse: fallbackEnd,
            autoSubmit: true
          });
        }
      });
      return suggestions;
    }

    // Stage 2: book chapter (trailing colon allowed)
    var matchChapter = text.match(/^(.*?)\s+(\d+)\s*:?\s*$/);
    if (matchChapter) {
      var bookQuery2 = $.trim(matchChapter[1]);
      var chapter2 = parseInt(matchChapter[2], 10);
      var books2 = bsMatchBooks(bookQuery2);
      if (books2.length) {
        var book2 = books2[0];
        var chapterMax2 = bsResolveChapterMax(book2.n, chapter2, preferredBibleId);
        if (chapterMax2 === null) {
          bsFetchChapterMax(book2.n, chapter2, preferredBibleId, function() {
            var currentInput2 = $.trim($('#bs-passage-input').val());
            if (currentInput2) {
              bsRenderSuggestions(bsGenerateSuggestions(currentInput2));
            }
          });
          return [];
        }
        if (chapterMax2 === 0) {
          return [];
        }
        for (var v = 1; suggestions.length < 8; v += bsMaxVersesConst) {
          if (chapterMax2 && v > chapterMax2) {
            break;
          }
          var endVerse2 = chapterMax2 ? Math.min(v + bsMaxVersesConst - 1, chapterMax2) : (v + bsMaxVersesConst - 1);
          suggestions.push({ label: book2.l + ' ' + chapter2 + ':' + v + '\u2013' + endVerse2,
            bookName: book2.n, bookLabel: book2.l,
            chapter: chapter2, startVerse: v, endVerse: endVerse2, autoSubmit: true });
        }
      }
      return suggestions;
    }

    // Stage 1: partial book name only
    if (!/\d/.test(text)) {
      bsMatchBooks(text).slice(0, 8).forEach(function(book) {
        suggestions.push({ label: book.l, bookName: book.n, bookLabel: book.l,
          chapter: 1, startVerse: 1, endVerse: bsMaxVersesConst, autoSubmit: false });
      });
    }
    return suggestions;
  }

  function bsParseBookAndChapter(rawInput) {
    var text = $.trim(bsNormalizeDashInput(rawInput));
    var matchVerse = text.match(/^(.*?)\s+(\d+):(\d+)(?:\s*-\s*(\d+))?\s*$/);
    if (matchVerse) {
      var bookMatch = bsMatchBooks($.trim(matchVerse[1]))[0];
      if (!bookMatch) {
        return null;
      }
      return { bookName: bookMatch.n, chapter: parseInt(matchVerse[2], 10) };
    }

    var matchChapter = text.match(/^(.*?)\s+(\d+)\s*:?\s*$/);
    if (matchChapter) {
      var chapterBook = bsMatchBooks($.trim(matchChapter[1]))[0];
      if (!chapterBook) {
        return null;
      }
      return { bookName: chapterBook.n, chapter: parseInt(matchChapter[2], 10) };
    }

    return null;
  }

  function bsPrimeChapterMax(rawInput) {
    var parsed = bsParseBookAndChapter(rawInput);
    if (!parsed) {
      return;
    }
    var activeBibleId = bsMetaBibleId();
    bsFetchChapterMax(parsed.bookName, parsed.chapter, activeBibleId, function() {
      var currentInput = $.trim($('#bs-passage-input').val());
      if (currentInput) {
        bsRenderSuggestions(bsGenerateSuggestions(currentInput));
      }
    });
  }

  function bsParsePassage(rawInput) {
    var text = $.trim(bsNormalizeDashInput(rawInput));
    var matchVerse = text.match(/^(.*?)\s+(\d+):(\d+)(?:\s*-\s*(\d+))?\s*$/);
    if (!matchVerse) {
      return null;
    }
    var bookMatch = bsMatchBooks($.trim(matchVerse[1]))[0];
    if (!bookMatch) {
      return null;
    }
    var startVerse = parseInt(matchVerse[3], 10);
    var endVerse = matchVerse[4] ? parseInt(matchVerse[4], 10) : startVerse;
    var chapter = parseInt(matchVerse[2], 10);
    var chapterMax = bsResolveChapterMax(bookMatch.n, chapter, bsMetaBibleId());
    if (chapterMax > 0) {
      endVerse = Math.min(endVerse, chapterMax);
    }
    if (startVerse < 1 || endVerse < startVerse) {
      return null;
    }
    return {
      bookName: bookMatch.n,
      bookLabel: bookMatch.l,
      chapter: chapter,
      startVerse: startVerse,
      endVerse: Math.min(endVerse, startVerse + bsMaxVersesConst - 1)
    };
  }

  function bsApplySuggestion(suggestion) {
    $('#bs-book').val(suggestion.bookName).data('book-label', suggestion.bookLabel);
    $('#bs-chapter').val(suggestion.chapter);
    $('#bs-start').val(suggestion.startVerse);
    $('#bs-end').val(suggestion.endVerse);
    var display = suggestion.bookLabel + ' ' + suggestion.chapter + ':' + suggestion.startVerse;
    if (suggestion.endVerse && suggestion.endVerse !== suggestion.startVerse) {
      display += '\u2013' + suggestion.endVerse;
    }
    $('#bs-passage-input').val(display);
    bsClosePassageSuggestions();
    if (suggestion.autoSubmit) { bsCommitPassageSearch(); }
  }

  var bsPassageCommitted = false;

  function bsClosePassageSuggestions() {
    $('#bs-passage-suggestions').empty().removeClass('is-open');
  }

  function bsSettingsScrollTarget() {
    var heading = document.getElementById('bs-settings-heading');
    if (!heading) {
      return null;
    }
    var nav = document.getElementById('ftco-navbar');
    var top = heading.getBoundingClientRect().top + window.pageYOffset - 8;
    // The theme (main.js) only shows the fixed menu after scrolling past 350px.
    if (nav && top > 350) {
      top -= nav.classList.contains('scrolled') ? nav.getBoundingClientRect().height : 52;
    }
    return Math.max(0, Math.round(top));
  }

  function bsScrollToSettings() {
    var top = bsSettingsScrollTarget();
    if (top === null) {
      return;
    }
    window.scrollTo({ top: top, behavior: 'smooth' });
    // The menu switches between in-flow and fixed while scrolling (mobile), which shifts the layout; correct once afterwards.
    window.setTimeout(function() {
      var corrected = bsSettingsScrollTarget();
      if (corrected !== null && Math.abs(corrected - window.pageYOffset) > 4) {
        window.scrollTo({ top: corrected, behavior: 'smooth' });
      }
    }, 700);
  }

  // Explicit search (Enter or picking a suggestion): run it once, close the dropdown and bring Settings to the top.
  function bsCommitPassageSearch() {
    bsPassageCommitted = true;
    bsClosePassageSuggestions();
    if (bsAutoApplyTimer) {
      window.clearTimeout(bsAutoApplyTimer);
      bsAutoApplyTimer = null;
    }
    $('#bibleStudyForm').trigger('submit');
    $('#bs-passage-input').trigger('blur');
    bsScrollToSettings();
  }

  function bsRenderSuggestions(suggestions) {
    var $box = $('#bs-passage-suggestions');
    if (bsPassageCommitted) {
      bsClosePassageSuggestions();
      return;
    }
    $box.empty();
    if (!suggestions.length) { $box.removeClass('is-open'); return; }
    $.each(suggestions, function(i, sugg) {
      $('<div>', {'class': 'bs-passage-suggestion-item', 'role': 'option'})
        .text(sugg.label).data('bsSuggestion', sugg).appendTo($box);
    });
    $box.addClass('is-open');
  }

  function bsInitPassageInput() {
    var book = String($('#bs-book').data('book-label') || '');
    var ch = String($('#bs-chapter').val() || '');
    var sv = String($('#bs-start').val() || '');
    var ev = String($('#bs-end').val() || '');
    if (book && ch && sv) {
      var display = book + ' ' + ch + ':' + sv;
      if (ev && ev !== sv) { display += '\u2013' + ev; }
      $('#bs-passage-input').val(display);
    }
  }

  $(document).on('input', '#bs-passage-input', function() {
    bsPassageCommitted = false;
    var value = $.trim($(this).val());
    bsRenderSuggestions(bsGenerateSuggestions(value));
    bsPrimeChapterMax(value);
  });

  $(document).on('change', '#bs-passage-input', function() {
    if (bsPassageCommitted) {
      return;
    }
    queueBibleStudyAutoApply(0);
  });

  $(document).on('keydown', '#bs-passage-input', function(event) {
    var $box = $('#bs-passage-suggestions');
    if (event.key === 'Enter' && !$box.find('.bs-passage-suggestion-item.is-active').length) {
      event.preventDefault();
      if ($.trim($(this).val())) {
        bsCommitPassageSearch();
      }
      return;
    }
    if (!$box.hasClass('is-open')) return;
    var $items = $box.find('.bs-passage-suggestion-item');
    var $active = $items.filter('.is-active');
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      $items.removeClass('is-active');
      ($active.length ? $active.next('.bs-passage-suggestion-item') : $items.first()).addClass('is-active');
      return;
    }
    if (event.key === 'ArrowUp') {
      event.preventDefault();
      $items.removeClass('is-active');
      ($active.length ? $active.prev('.bs-passage-suggestion-item') : $items.last()).addClass('is-active');
      return;
    }
    if (event.key === 'Enter' && $active.length) {
      event.preventDefault();
      bsApplySuggestion($active.data('bsSuggestion'));
      return;
    }
    if (event.key === 'Escape') { $box.empty().removeClass('is-open'); }
  });

  $(document).on('click', '#bs-passage-suggestions .bs-passage-suggestion-item', function() {
    bsApplySuggestion($(this).data('bsSuggestion'));
  });

  $(document).on('click', function(event) {
    if (!$(event.target).closest('.bs-passage-wrap').length) {
      $('#bs-passage-suggestions').empty().removeClass('is-open');
    }
  });

  function bibleStudyVersesUrl() {
    return String($('.bible-study-shell').data('verses-url') || '').trim();
  }

  function bibleStudyOriginalTextUrl() {
    return String($('.bible-study-shell').data('original-text-url') || '').trim();
  }

  function bibleStudyWordAlignmentUrl() {
    return String($('.bible-study-shell').data('word-alignment-url') || '').trim();
  }

  function bibleStudySearchUrl() {
    return String($('.bible-study-shell').data('search-url') || '').trim();
  }

  function escapeRegExp(value) {
    return String(value || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function bibleStudySearchTerms(query) {
    var seen = {};
    return String(query || '')
      .split(/\s+/)
      .map(function(term) { return $.trim(term).replace(/^["'“”‘’]+|["'“”‘’.,;:!?]+$/g, ''); })
      .filter(function(term) {
        var normalized = term.toLowerCase();
        if (term.length < 2 || seen[normalized]) {
          return false;
        }
        seen[normalized] = true;
        return true;
      });
  }

  function bibleStudyHighlightedSearchText(text, query) {
    var html = escapeHtml(String(text || ''));
    var terms = bibleStudySearchTerms(query);
    if (!terms.length) {
      return html;
    }
    terms.sort(function(a, b) { return b.length - a.length; });
    var pattern = terms.map(escapeRegExp).join('|');
    if (!pattern) {
      return html;
    }
    return html.replace(new RegExp('(' + pattern + ')', 'gi'), '<strong class="bs-search-highlight">$1</strong>');
  }

  function bsNormalizeExactText(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/["'“”‘’]/g, '')
      .replace(/[^a-z0-9\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function bsMatchesExactPhrase(text, phrase) {
    var normalizedPhrase = bsNormalizeExactText(phrase);
    if (!normalizedPhrase) {
      return true;
    }
    var normalizedText = bsNormalizeExactText(text);
    return normalizedText.indexOf(normalizedPhrase) !== -1;
  }

  function bsSearchBookRange(fromBook, toBook) {
    var fromMeta = bsSearchBookMeta[fromBook];
    var toMeta = bsSearchBookMeta[toBook];
    if (!fromMeta || !toMeta) {
      return '';
    }
    return fromMeta[0] + '.1.1-' + toMeta[0] + '.' + toMeta[1] + '.' + toMeta[2];
  }

  function bsSearchScopeRange() {
    var scope = String($('#bs-search-scope').val() || 'whole');
    if (scope === 'custom' || scope === 'custom_books') {
      return bsSearchBookRange($('#bs-search-from-book').val(), $('#bs-search-to-book').val());
    }
    if (scope === 'writings') {
      return [
        bsSearchBookRange('Ruth', 'Ruth'),
        bsSearchBookRange('ChroniclesFirstBook', 'ChroniclesSecondBook'),
        bsSearchBookRange('Ezra', 'Esther'),
        bsSearchBookRange('Job', 'SongOfSolomon'),
        bsSearchBookRange('Lamentations', 'Lamentations'),
        bsSearchBookRange('Daniel', 'Daniel')
      ].filter(Boolean).join(',');
    }
    var preset = bsSearchScopeRanges[scope] || bsSearchScopeRanges.whole;
    return bsSearchBookRange(preset[0], preset[1]);
  }

  function bsSearchScopeLabel() {
    var $option = $('#bs-search-scope option:selected');
    if ($('#bs-search-scope').val() !== 'custom' && $('#bs-search-scope').val() !== 'custom_books') {
      return $.trim($option.text());
    }
    return $.trim($('#bs-search-from-book option:selected').text()) + ' - ' + $.trim($('#bs-search-to-book option:selected').text());
  }

  function bsSyncAdvancedSearchControls() {
    var scope = String($('#bs-search-scope').val() || '');
    $('.bs-search-custom-range').toggle(scope === 'custom' || scope === 'custom_books');
  }

  function bsSearchEffectiveQuery(query) {
    var text = $.trim(String(query || ''));
    if ($('#bs-search-exact-phrase').is(':checked') && text && text.charAt(0) !== '"') {
      return '"' + text + '"';
    }
    return text;
  }

  function bsCurrentSearchOptions(offset) {
    return {
      limit: parseInt($('#bs-search-limit').val(), 10) || 50,
      offset: parseInt(offset || 0, 10) || 0,
      sort: String($('#bs-search-sort').val() || 'canonical'),
      fuzziness: String($('#bs-search-fuzziness').val() || 'AUTO'),
      range: bsSearchScopeRange(),
      scopeLabel: bsSearchScopeLabel(),
      exactPhrase: $('#bs-search-exact-phrase').is(':checked')
    };
  }

  function renderBibleStudySearchResults(payload) {
    var $target = $('#bs-word-search-results');
    var originalResults = (payload && payload.results) || [];
    var results = originalResults.slice();
    var query = String((bsLastWordSearch && bsLastWordSearch.query) || (payload && payload.query) || $('#bs-word-search-input').val() || '');
    if (bsLastWordSearch && bsLastWordSearch.exactPhrase) {
      results = results.filter(function(result) {
        return bsMatchesExactPhrase(String((result && result.text) || ''), query);
      });
    }
    var exactPhraseFiltered = !!(bsLastWordSearch && bsLastWordSearch.exactPhrase && results.length !== originalResults.length);
    var bibleName = String((payload && payload.bible_display_name) || '');
    var total = parseInt((payload && payload.total) || 0, 10) || results.length;
    var verseCount = parseInt((payload && payload.verse_count) || total, 10) || total;
    var page = parseInt((payload && payload.page) || 1, 10) || 1;
    var pageCount = parseInt((payload && payload.page_count) || 1, 10) || 1;
    var pages = (payload && payload.pages) || [];
    if (exactPhraseFiltered) {
      // Keep summary consistent with what is visibly rendered after strict phrase filtering.
      total = results.length;
      verseCount = results.length;
      page = 1;
      pageCount = 1;
      pages = [];
    }
    var currentPage = pages.filter(function(item) { return item && item.current; })[0] || null;
    var pageRange = String((currentPage && currentPage.range_label) || '');
    if (!results.length) {
      $target.html('<div class="alert alert-info mb-0">{% trans "No matching verses found in the first selected translation." %}</div>');
      return;
    }

    var summaryHtml = '<div class="bs-word-search-summary">' +
      '<div><strong>' + escapeHtml(query) + '</strong></div>' +
      '<div>{% trans "occurs" %} ' + escapeHtml(String(total)) + ' {% trans "times in" %} <strong>' + escapeHtml(String(verseCount)) + '</strong> {% trans "verses in" %} ' + escapeHtml(bibleName || '{% trans "the selected Bible" %}') + '.</div>' +
      '<div class="mt-1">{% trans "Page" %} ' + escapeHtml(String(page)) + ' / ' + escapeHtml(String(pageCount)) + ': ' +
        '<em>' + (bsLastWordSearch && bsLastWordSearch.exactPhrase ? '{% trans "exact phrase" %}' : '{% trans "all keywords" %}') + '</em>' +
        (pageRange ? ' (' + escapeHtml(pageRange) + ')' : '') +
        (bsLastWordSearch && bsLastWordSearch.scopeLabel ? ' · ' + escapeHtml(bsLastWordSearch.scopeLabel) : '') +
      '</div>' +
    '</div>';

    var itemsHtml = results.map(function(result) {
      var reference = String((result && result.reference) || '');
      var parsed = parseBibleStudyDeeplinkReference(reference);
      var tag = parsed ? 'button' : 'div';
      var attrs = parsed
        ? ' type="button" data-bible-study-reference="' + escapeHtml(reference) + '"'
        : '';
      return '<' + tag + ' class="bs-word-search-result"' + attrs + '>' +
        '<span class="bs-word-search-reference">' + escapeHtml(reference || '{% trans "Search result" %}') + '</span>' +
        '<span>' + bibleStudyHighlightedSearchText(String((result && result.text) || ''), query) + '</span>' +
        '</' + tag + '>';
    }).join('');

    var pagesHtml = pages.length > 1
      ? '<div class="bs-word-search-pages">' + pages.map(function(pageItem) {
          var label = String(pageItem.page || '') + '. ' + (pageItem.range_label ? pageItem.range_label : '{% trans "Page" %} ' + String(pageItem.page || ''));
          return '<button type="button" class="btn btn-sm commentary-action-btn bs-word-search-page-btn' + (pageItem.current ? ' active' : '') + '" data-search-offset="' + escapeHtml(String(pageItem.offset || 0)) + '">' + escapeHtml(label) + '</button>';
        }).join('') + '</div>'
      : '';

    $target.html(
      '<div class="bs-word-search-panel">' +
      '<div class="bs-word-search-panel-head"><span class="bible-study-translation-title">{% trans "Search results" %}' + (bibleName ? ' · ' + escapeHtml(bibleName) : '') + '</span><button type="button" class="bs-word-search-close-btn" aria-label="{% trans "Close search results" %}" title="{% trans "Close search results" %}"><i class="fa fa-times" aria-hidden="true"></i></button></div>' +
      summaryHtml +
      pagesHtml +
      itemsHtml +
      '</div>'
    );
  }

  function runBibleStudyWordSearch(offset) {
    var endpoint = bibleStudySearchUrl();
    var query = $.trim($('#bs-word-search-input').val());
    var options = bsCurrentSearchOptions(offset || 0);
    var firstBible = selectedBibleDescriptors()[0] || null;
    var $target = $('#bs-word-search-results');
    if (!query) {
      $target.html('<div class="alert alert-warning mb-0">{% trans "Enter one or more words to search." %}</div>');
      return;
    }
    if (!endpoint || !firstBible || !firstBible.id) {
      $target.html('<div class="alert alert-warning mb-0">{% trans "Choose a first translation before searching." %}</div>');
      return;
    }

    $target.html('<div class="bs-word-search-panel"><div class="bs-word-search-panel-head"><span class="bible-study-translation-title">{% trans "Search results" %}</span><button type="button" class="bs-word-search-close-btn" aria-label="{% trans "Close search results" %}" title="{% trans "Close search results" %}"><i class="fa fa-times" aria-hidden="true"></i></button></div><p class="mb-0 text-muted"><i class="fa fa-spinner fa-spin mr-1"></i>{% trans "Searching the first selected translation…" %}</p></div>');
    bsLastWordSearch = $.extend({
      bibleId: firstBible.id,
      query: query
    }, options);
    $.ajax({
      type: 'GET',
      url: endpoint,
      dataType: 'json',
      data: {
        bible_id: firstBible.id,
        query: bsSearchEffectiveQuery(query),
        limit: options.limit,
        offset: options.offset,
        sort: options.sort,
        fuzziness: options.fuzziness,
        range: options.range
      }
    }).done(function(payload) {
      renderBibleStudySearchResults(payload || {});
    }).fail(function(xhr) {
      var message = '{% trans "Search is not available for this translation right now." %}';
      if (xhr && xhr.responseJSON && xhr.responseJSON.error) {
        message = xhr.responseJSON.error;
      }
      $target.html('<div class="alert alert-warning mb-0">' + escapeHtml(message) + '</div>');
    });
  }

  $(document).on('click', '.bible-study-shell .bs-word-search-close-btn', function() {
    $('#bs-word-search-results').empty();
  });

  $(document).on('change', '.bible-study-shell #bs-search-scope', function() {
    bsSyncAdvancedSearchControls();
  });

  $(document).on('click', '.bible-study-shell #bs-search-advanced-apply', function() {
    $('#bsWordSearchAdvancedModal').modal('hide');
    runBibleStudyWordSearch(0);
  });

  $(document).on('click', '.bible-study-shell .bs-word-search-page-btn', function() {
    runBibleStudyWordSearch(parseInt($(this).data('searchOffset'), 10) || 0);
  });

  function verseSpinnerHtml(source) {
    var spinnerClass = source === 'api' ? 'verse-loading-spinner verse-loading-spinner-api' : 'verse-loading-spinner verse-loading-spinner-cache';
    return '<i class="fa fa-spinner fa-spin ' + spinnerClass + '"></i>';
  }

  function bibleStudyRangeKey(bibleId, book, chapter, startVerse, endVerse) {
    return [String(bibleId || ''), String(book || ''), String(chapter || ''), String(startVerse || ''), String(endVerse || '')].join('|');
  }

  function clampBibleStudyRange() {
    var maxVerses = {{ max_verses }};
    var start = parseInt($('#bs-start').val(), 10) || 1;
    var end = parseInt($('#bs-end').val(), 10) || start;
    if (end < start) end = start;
    if (end > start + maxVerses - 1) end = start + maxVerses - 1;
    $('#bs-end').val(end);
    return {
      startVerse: start,
      endVerse: end
    };
  }

  function selectedBibleDescriptors() {
    var bibles = [];
    $('.bs-bible-selector-col:visible .bs-bible-select').each(function() {
      var $select = $(this);
      var bibleId = String($select.val() || '').trim();
      if (!bibleId) {
        return;
      }
      var $option = $select.find('option:selected');
      bibles.push({
        id: bibleId,
        displayName: $.trim($option.text()),
        copyright: String($option.data('copyright') || '')
      });
    });
    return bibles;
  }

  function selectedBookLabel() {
    return String($('#bs-book').data('book-label') || '');
  }

  function bibleStudyBookLabel(bookName) {
    var match = bsBookList.filter(function(book) {
      return String(book.n) === String(bookName || '');
    })[0];
    return match ? String(match.l || bookName || '') : String(bookName || '');
  }

  function currentBibleStudyState() {
    var range = clampBibleStudyRange();
    bsCombineVerses = $('#bs-combine-verses').is(':checked');
    return {
      book: String($('#bs-book').val() || ''),
      bookLabel: selectedBookLabel(),
      chapter: parseInt($('#bs-chapter').val(), 10) || 1,
      startVerse: range.startVerse,
      endVerse: range.endVerse,
      bibles: selectedBibleDescriptors(),
      showOriginalText: $('#bs-show-original').is(':checked'),
      combineVerses: bsCombineVerses
    };
  }

  function queueBibleStudyAutoApply(delayMs) {
    if (bsSuppressAutoApply) {
      return;
    }
    if (bsAutoApplyTimer) {
      window.clearTimeout(bsAutoApplyTimer);
    }
    bsAutoApplyTimer = window.setTimeout(function() {
      $('#bibleStudyForm').trigger('submit');
    }, Math.max(0, Number(delayMs || 0)));
  }

  function updateBibleStudyHistory(state) {
    var params = new URLSearchParams();
    if (state.book) params.set('book', state.book);
    params.set('chapter', String(state.chapter));
    params.set('start_verse', String(state.startVerse));
    params.set('end_verse', String(state.endVerse));
    if (state.showOriginalText) {
      params.set('show_original', '1');
    }
    params.set('combine_verses', state.combineVerses ? '1' : '0');
    $.each(state.bibles, function(_, bible) {
      if (bible.id) {
        params.append('bible_id', bible.id);
      }
    });
    if (bsPendingStrongsSelection && bsPendingStrongsSelection.verse && bsPendingStrongsSelection.strongs) {
      params.set('selected_verse', String(bsPendingStrongsSelection.verse));
      params.set('selected_strongs', String(bsPendingStrongsSelection.strongs));
    }
    var newUrl = window.location.pathname + '?' + params.toString();
    window.history.replaceState({}, '', newUrl);
  }

  function bibleStudyVerseNumbers(state) {
    var numbers = [];
    for (var verseNumber = state.startVerse; verseNumber <= state.endVerse; verseNumber += 1) {
      numbers.push(verseNumber);
    }
    return numbers;
  }

  function effectiveMaxBibleSlots() {
    return 4;
  }

    return [
      'Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges', 'Ruth',
      'SamuelFirstBook', 'SamuelSecondBook', 'KingsFirstBook', 'KingsSecondBook',
      'ChroniclesFirstBook', 'ChroniclesSecondBook', 'Ezra', 'Nehemiah', 'Esther', 'Job',
      'Psalms', 'Proverbs', 'Ecclesiastes', 'SongOfSolomon', 'Isaiah', 'Jeremiah',
      'Lamentations', 'Ezekiel', 'Daniel', 'Hosea', 'Joel', 'Amos', 'Obadiah', 'Jonah',
      'Micah', 'Nahum', 'Habakkuk', 'Zephaniah', 'Haggai', 'Zechariah', 'Malachi'
    ].indexOf(String(book || '')) !== -1;
  }

  function scripturaBookName(book) {
    var mapping = {
      SamuelFirstBook: '1 Samuel', SamuelSecondBook: '2 Samuel', KingsFirstBook: '1 Kings', KingsSecondBook: '2 Kings',
      ChroniclesFirstBook: '1 Chronicles', ChroniclesSecondBook: '2 Chronicles', SongOfSolomon: 'Song of Solomon',
      CorinthiansFirstBook: '1 Corinthians', CorinthiansSecondBook: '2 Corinthians', ThessaloniansFirstBook: '1 Thessalonians',
      ThessaloniansSecondBook: '2 Thessalonians', TimothyFirstBook: '1 Timothy', TimothySecondBook: '2 Timothy',
      PeterFirstBook: '1 Peter', PeterSecondBook: '2 Peter', JohnFirstBook: '1 John', JohnSecondBook: '2 John',
      JohnThirdBook: '3 John'
    };
    return mapping[String(book || '')] || String(book || '');

    var mapping = {

  function buildCombinedBibleStudyText(state, bibleId, displayName, verses) {
    var lines = [];
    var abbreviation = bibleStudyAbbreviationForSelection(bibleId, displayName || '').toUpperCase();
    bibleStudyVerseNumbers(state).forEach(function(verseNumber) {
      var text = String(verses[String(verseNumber)] || '—');
      var footer = $.trim(String((state && state.bookLabel) || '')) + ' ' + String((state && state.chapter) || '') + ':' + String(verseNumber || '');
      if (abbreviation) {
        footer += ' (' + abbreviation + ')';

      lines.push('<span class="js-copy-selectable-line bs-copy-line" data-copy-group="' + escapeHtml('bs|' + String(bibleId || '') + '|' + String((state && state.book) || '') + '|' + String((state && state.chapter) || '')) + '" data-copy-book-label="' + escapeHtml(String((state && state.bookLabel) || '')) + '" data-copy-chapter="' + escapeHtml(String((state && state.chapter) || '')) + '" data-copy-verse="' + escapeHtml(String(verseNumber || '')) + '" data-copy-abbreviation="' + escapeHtml(abbreviation) + '" data-copy-text="' + escapeHtml(text.replace(/\s+/g, ' ').trim()) + '" data-copy-footer="' + escapeHtml(footer) + '">' + escapeHtml(String(verseNumber) + ' ' + text).replace(/\n/g, '<br>') + '</span>');
    });

        return bibleStudyCombinedVerseActionHtml(state, verseNumber);
      }).join('');

      $('#bs-results-region').html(
        bibleStudySummaryHtml(state) +
        '<div class="row bible-study-results" id="bs-verse-area" data-book="' + escapeHtml(state.book) + '" data-chapter="' + escapeHtml(String(state.chapter)) + '" data-start-verse="' + escapeHtml(String(state.startVerse)) + '" data-end-verse="' + escapeHtml(String(state.endVerse)) + '"><div class="col-12"><div class="our-services-wrapper mb-3 bible-study-verse-card"><div class="services-inner" style="padding:1rem 1.2rem; align-items:flex-start;"><div class="our-services-text w-100"><div class="row w-100">' + combinedCards + '</div></div></div></div>' + combinedVerseActions + '</div></div>'
      );
      ensureBibleStudyCopyButtons(state);
      updateBibleStudyScripturaVisibility();
      return;
    }

    var verseCardsHtml = bibleStudyVerseNumbers(state).map(function(verseNumber) {
      return bibleStudyVerseCardHtml(state, verseNumber);
    }).join('');

    $('#bs-results-region').html(
      bibleStudySummaryHtml(state) +
      '<div class="row bible-study-results" id="bs-verse-area" data-book="' + escapeHtml(state.book) + '" data-chapter="' + escapeHtml(String(state.chapter)) + '" data-start-verse="' + escapeHtml(String(state.startVerse)) + '" data-end-verse="' + escapeHtml(String(state.endVerse)) + '"><div class="col-12">' + verseCardsHtml + '</div></div>'
    );
    ensureBibleStudyCopyButtons(state);
    updateBibleStudyScripturaVisibility();
  }

  function applyBibleStudyPayloadToDom(state, bibleId, payload) {
    var displayName = String((payload && payload.bible_display_name) || '').trim();
    var verses = (payload && payload.verses) ? payload.verses : {};
    var copyrights = String((payload && payload.copyright) || '');
    if (state.combineVerses) {
      var $combinedCard = $('.bible-study-translation-card[data-bible-id="' + bibleId + '"]').first();
      if (!$combinedCard.length) {
        return;
      }
      if (displayName) {
        $combinedCard.find('.bible-study-translation-title').text(displayName);
      }
      $combinedCard.find('[data-bible-verse-text="1"]').html(buildCombinedBibleStudyText(state, bibleId, displayName || (bibleStudyAbbreviationForSelection(bibleId, $combinedCard.find('.bible-study-translation-title').text()) || ''), verses));
      if (copyrights) {
        if (!$combinedCard.find('.bible-study-copyright').length) {
          $combinedCard.append('<p class="bible-study-copyright mb-0"><small></small></p>');
        }
        $combinedCard.find('.bible-study-copyright small').text(copyrights);
      }
      ensureBibleStudyCopyButtons(state);
      return;
    }
    $('.bible-study-translation-card[data-bible-id="' + bibleId + '"]').each(function() {
      var $card = $(this);
      var verseNumber = String($card.data('verse') || '');
      var copyFooter = $.trim(String((state && state.bookLabel) || '')) + ' ' + String((state && state.chapter) || '') + ':' + verseNumber;
      var abbr = bibleStudyAbbreviationForSelection(bibleId, displayName || $card.find('.bible-study-translation-title').text()).toUpperCase();
      if (abbr) {
        copyFooter += ' (' + abbr + ')';
      }
      if (displayName) {
        $card.find('.bible-study-translation-title').text(displayName);
      }
      $card.find('[data-bible-verse-text="1"]').html(escapeHtml(String(verses[verseNumber] || '—')).replace(/\n/g, '<br>'))
        .attr('data-copy-footer', copyFooter)
        .attr('data-copy-group', ['bs', bibleId, state.book, state.chapter].join('|'))
        .attr('data-copy-book-label', String(state.bookLabel || ''))
        .attr('data-copy-chapter', String(state.chapter || ''))
        .attr('data-copy-verse', verseNumber)
        .attr('data-copy-abbreviation', abbr)
        .attr('data-copy-text', String(verses[verseNumber] || '—').replace(/\s+/g, ' ').trim());
      if (verseNumber === String(state.endVerse) && copyrights) {
        if (!$card.find('.bible-study-copyright').length) {
          $card.append('<p class="bible-study-copyright mb-0"><small></small></p>');
        }
        $card.find('.bible-study-copyright small').text(copyrights);
      } else if (verseNumber === String(state.endVerse) && !copyrights && !$card.find('.bible-study-copyright').length) {
        var fallbackCopyright = $.trim(String($('.bs-bible-select option[value="' + bibleId + '"]').data('copyright') || ''));
        if (fallbackCopyright) {
          $card.append('<p class="bible-study-copyright mb-0"><small></small></p>');
          $card.find('.bible-study-copyright small').text(fallbackCopyright);
        }
      }
    });
    ensureBibleStudyCopyButtons(state);
  }

  // ---- Translated text <-> original language word alignment ----

  // Languages the server can align: English (tagged KJV or lexicon scoring) and Dutch (tagged SV).
  function bibleStudySupportsAlignment(displayName) {
    return /^\s*(en|nl)\s*-/i.test(String(displayName || ''));
  }

  function bibleStudyVerseTextNode(bibleId, verseNumber) {
    return $('.bible-study-translation-card[data-bible-id="' + bibleId + '"][data-verse="' + verseNumber + '"]')
      .find('.bs-verse-text')
      .first();
  }

  function bibleStudyAlignedVerseHtml(alignment, verseNumber) {
    var tokens = (alignment && alignment.tokens) || [];
    if (!tokens.length || !alignment.aligned_count) {
      return '';
    }
    var parts = [];
    tokens.forEach(function(token) {
      var text = escapeHtml(String((token && token.text) || '')).replace(/\n/g, '<br>');
      var wordIndex = parseInt((token && token.word_index), 10);
      if (isNaN(wordIndex) || wordIndex < 0) {
        parts.push(text);
        return;
      }
      parts.push('<span class="bs-aligned-word" data-verse="' + escapeHtml(String(verseNumber)) +
        '" data-word-index="' + escapeHtml(String(wordIndex)) +
        '" tabindex="0" role="button" title="{% trans "Show the original word and its Strong&#39;s details" as bsi18n_aligned_hint %}{{ bsi18n_aligned_hint|escapejs }}">' + text + '</span>');
    });
    return parts.join('');
  }

  function applyBibleStudyAlignmentToDom(bibleId, alignmentPayload) {
    var verses = (alignmentPayload && alignmentPayload.verses) || {};
    $.each(verses, function(verseNumber, alignment) {
      var html = bibleStudyAlignedVerseHtml(alignment, verseNumber);
      if (!html) {
        return;
      }
      var $text = bibleStudyVerseTextNode(bibleId, verseNumber);
      if (!$text.length || $text.find('.bs-verse-spinner').length) {
        return;
      }
      $text.html(html);
    });
  }

  function collectBibleStudyVerseTexts(state, bibleId) {
    var verses = {};
    bibleStudyVerseNumbers(state).forEach(function(verseNumber) {
      var $text = bibleStudyVerseTextNode(bibleId, verseNumber);
      if (!$text.length || $text.find('.bs-verse-spinner').length) {
        return;
      }
      var text = $.trim($text.text());
      if (text && text !== '—') {
        verses[String(verseNumber)] = text;
      }
    });
    return verses;
  }

  function loadBibleStudyWordAlignment(state, bible) {
    var url = bibleStudyWordAlignmentUrl();
    if (!url || !state || state.combineVerses || !bible || !bibleStudySupportsAlignment(bible.displayName)) {
      return;
    }

    var rangeKey = bibleStudyRangeKey(bible.id, state.book, state.chapter, state.startVerse, state.endVerse);
    if (bibleStudyAlignmentCache[rangeKey]) {
      applyBibleStudyAlignmentToDom(bible.id, bibleStudyAlignmentCache[rangeKey]);
      return;
    }

    var verses = collectBibleStudyVerseTexts(state, bible.id);
    if (!Object.keys(verses).length) {
      return;
    }

    $.ajax({
      type: 'POST',
      url: url,
      timeout: 20000,
      dataType: 'json',
      data: {
        csrfmiddlewaretoken: (document.cookie.match(/csrftoken=([^;]+)/) || [null, ''])[1] || '',
        bible_id: bible.id,
        book: state.book,
        chapter: state.chapter,
        verses: JSON.stringify(verses)
      },
      success: function(payload) {
        if (!payload || payload.supported === false) {
          return;
        }
        bibleStudyAlignmentCache[rangeKey] = payload;
        applyBibleStudyAlignmentToDom(bible.id, payload);
      }
    });
  }

  function loadBibleStudyWordAlignments(state) {
    if (!state || state.combineVerses) {
      return;
    }
    $.each(state.bibles || [], function(_, bible) {
      loadBibleStudyWordAlignment(state, bible);
    });
  }

  function syncBibleStudyAlignedHover(verseNumber, wordIndex, hovering) {
    $('.bs-aligned-word[data-verse="' + verseNumber + '"][data-word-index="' + wordIndex + '"]')
      .toggleClass('is-hovered', !!hovering);
  }

  function syncBibleStudyAlignedSelection(verseNumber, wordIndex) {
    $('.bs-aligned-word[data-verse="' + verseNumber + '"]').removeClass('active');
    $('.bs-aligned-word[data-verse="' + verseNumber + '"][data-word-index="' + wordIndex + '"]').addClass('active');
  }

  function openBibleStudyOriginalWordFromEnglish(verseNumber, wordIndex) {
    if (!verseNumber || isNaN(wordIndex) || wordIndex < 0) {
      return;
    }
    syncBibleStudyAlignedSelection(verseNumber, wordIndex);

    var $shell = $('.bible-study-original-shell[data-verse="' + verseNumber + '"]');
    if (bsOriginalOpenVerses[String(verseNumber)] && $shell.length && $shell.data('versePayload')) {
      selectBibleStudyOriginalWord(verseNumber, wordIndex);
      return;
    }

    bsPendingAlignedSelection = { verse: String(verseNumber), wordIndex: wordIndex };
    bsOriginalOpenVerses[String(verseNumber)] = true;
    var state = currentBibleStudyState();
    state.showOriginalText = normalizeOpenOriginalVersesForState(state);
    syncBibleStudyOriginalToggleButtons();
    loadBibleStudyOriginalText(state);
  }

  function bibleStudyAbbreviationForDisplay(displayName) {
    var parts = String(displayName || '').split(' - ');
    if (parts.length >= 2 && $.trim(parts[1])) {
      return $.trim(parts[1]).toUpperCase();
    }
    return $.trim(String(displayName || '')).toUpperCase();
  }

  function bibleStudyAbbreviationForSelection(bibleId, displayName) {
    var optionText = $.trim(String($('.bs-bible-select option[value="' + bibleId + '"]').first().text() || ''));
    if (optionText) {
      var optionParts = optionText.split(' - ');
      if (optionParts.length >= 2 && $.trim(optionParts[1])) {
        return $.trim(optionParts[1]).toUpperCase();
      }
    }
    return bibleStudyAbbreviationForDisplay(displayName || '');
  }

  function clearBibleStudyWordSearch() {
    $('#bs-word-search-input').val('');
    $('#bs-word-search-results').empty();
  }

  function bibleStudyPassageLabel(state, verseNumber) {
    return $.trim(String((state && state.bookLabel) || '')) + ' ' + String((state && state.chapter) || '') + ':' + String(verseNumber || '');
  }

  function jumpToBibleStudyReference(parsed) {
    if (!parsed) {
      return;
    }
    $('#bs-book').val(parsed.book);
    var bsFoundBook = bsBookList.filter(function(b) { return b.n === parsed.book; })[0];
    if (bsFoundBook) {
      $('#bs-book').data('book-label', bsFoundBook.l);
    }
    $('#bs-chapter').val(parsed.chapter);
    $('#bs-start').val(parsed.startVerse);
    $('#bs-end').val(parsed.endVerse);
    bsInitPassageInput();
    $('#bibleStudyForm').trigger('submit');
  }

  function applyPendingStrongsSelectionToVerse(verseNumber, versePayload) {
    if (!bsPendingStrongsSelection || String(bsPendingStrongsSelection.verse || '') !== String(verseNumber || '')) {
      return false;
    }
    var targetStrongs = normalizeBibleStudyStrongsCode(bsPendingStrongsSelection.strongs || '');
    if (!targetStrongs) {
      return false;
    }

    var words = (versePayload && versePayload.words) || [];
    for (var wordIndex = 0; wordIndex < words.length; wordIndex += 1) {
      var candidates = (words[wordIndex] && words[wordIndex].candidates) || [];
      for (var candidateIndex = 0; candidateIndex < candidates.length; candidateIndex += 1) {
        var strongsNumber = normalizeBibleStudyStrongsCode((candidates[candidateIndex] && candidates[candidateIndex].strongs_number) || '');
        if (strongsNumber === targetStrongs) {
          selectBibleStudyOriginalWord(String(verseNumber), wordIndex);
          bsPendingStrongsSelection = {
            verse: String(verseNumber),
            strongs: targetStrongs
          };
          return true;
        }
      }
    }
    return false;
  }

  function ensureBibleStudyCopyButtons(state) {
    $('.bible-study-translation-card').each(function() {
      var $translation = $(this);
      var $button = $translation.find('.bible-study-copy-btn').first();
      if (!$button.length) {
        return;
      }
      var verseNumber = String($translation.data('verse') || $button.data('verse') || '');
      var displayName = $.trim($translation.find('.bible-study-translation-title').first().text());
      $button
        .attr('data-copy-bible-id', String($translation.data('bible-id') || ''))
        .attr('data-copy-verse', verseNumber)
        .attr('data-copy-abbreviation', bibleStudyAbbreviationForDisplay(displayName).toUpperCase());
    });
  }

  function bibleStudyVerseTextForCopy($card) {
    var $clone = $card.find('.bs-verse-text').first().clone();
    $clone.find('br').replaceWith('\n');
    return $.trim($clone.text());
  }

  function bibleStudyCopyRangeForClick(bibleId, verseNumber) {
    verseNumber = parseInt(verseNumber, 10);
    if (!bibleId || !verseNumber) {
      bsCopySelection = null;
      return null;
    }

    if (!bsCopySelection || bsCopySelection.bibleId !== bibleId) {
      bsCopySelection = { bibleId: bibleId, startVerse: verseNumber, endVerse: verseNumber };
      return bsCopySelection;
    }

    if (verseNumber === bsCopySelection.endVerse + 1) {
      bsCopySelection.endVerse = verseNumber;
    } else if (verseNumber === bsCopySelection.startVerse - 1) {
      bsCopySelection.startVerse = verseNumber;
    } else if (verseNumber < bsCopySelection.startVerse || verseNumber > bsCopySelection.endVerse) {
      bsCopySelection = { bibleId: bibleId, startVerse: verseNumber, endVerse: verseNumber };
    }
    return bsCopySelection;
  }

  function bibleStudyCopyTextForRange(range) {
    var lines = [];
    for (var verseNumber = range.startVerse; verseNumber <= range.endVerse; verseNumber += 1) {
      var $card = $('.bible-study-translation-card[data-bible-id="' + range.bibleId + '"][data-verse="' + verseNumber + '"]').first();
      var verseText = bibleStudyVerseTextForCopy($card);
      if (verseText) {
        lines.push(verseText);
      }
    }
    return lines.join('\n');
  }

  function bibleStudyCopyFooter(state, range, abbreviation) {
    var label = $.trim(String((state && state.bookLabel) || '')) + ' ' + String((state && state.chapter) || '') + ':' + String(range.startVerse || '');
    if (range.endVerse !== range.startVerse) {
      label += '-' + String(range.endVerse || '');
    }
    if (abbreviation) {
      label += ' (' + abbreviation + ')';
    }
    return label;
  }

  function writeBibleStudyCopyText(text, onDone) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        if (onDone) { onDone(true); }
      }).catch(function() {
        if (onDone) { onDone(false); }
      });
      return;
    }

    var $temp = $('<textarea></textarea>').css({
      left: '-9999px',
      position: 'fixed',
      top: '0'
    }).val(text).appendTo('body');
    $temp.trigger('focus').trigger('select');
    var copied = false;
    try {
      copied = document.execCommand('copy');
    } catch (error) {
      copied = false;
    }
    $temp.remove();
    if (onDone) { onDone(copied); }
  }

  function applyPendingAlignedSelectionToVerse(verseNumber) {
    if (!bsPendingAlignedSelection || String(bsPendingAlignedSelection.verse || '') !== String(verseNumber || '')) {
      return;
    }
    var wordIndex = bsPendingAlignedSelection.wordIndex;
    bsPendingAlignedSelection = null;
    selectBibleStudyOriginalWord(String(verseNumber), wordIndex);
    var shell = $('.bible-study-original-shell[data-verse="' + verseNumber + '"]').get(0);
    if (shell && shell.scrollIntoView) {
      shell.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }

  function ensureOriginalTextPanels(state) {
    if (!state.showOriginalText) {
      $('.bible-study-original-row').remove();
      return;
    }

    if (state.combineVerses) {
      $('.bible-study-combined-verse-actions').each(function() {
        var $card = $(this);
        if ($card.find('.bible-study-original-row').length) {
          return;
        }
        var verseNumber = String($card.data('verse') || '');
        if (!verseNumber) {
          return;
        }
        $card.find('.bible-study-commentary-slot').first().before(bibleStudyOriginalPanelsHtml(state, verseNumber));
      });
      return;
    }

    $('.bible-study-verse-card').each(function() {
      var $card = $(this);
      if ($card.find('.bible-study-original-row').length) {
        return;
      }
      var verseNumber = String($card.find('.bible-study-translation-card').first().data('verse') || '');
      if (!verseNumber) {
        return;
      }
      $card.find('.bible-study-commentary-slot').first().before(bibleStudyOriginalPanelsHtml(state, verseNumber));
    });
  }

  function hasOpenOriginalVerses() {
    return Object.keys(bsOriginalOpenVerses).length > 0;
  }

  function normalizeOpenOriginalVersesForState(state) {
    var nextOpen = {};
    bibleStudyVerseNumbers(state).forEach(function(verseNumber) {
      var key = String(verseNumber);
      if (bsOriginalOpenVerses[key]) {
        nextOpen[key] = true;
      }
    });
    bsOriginalOpenVerses = nextOpen;
    $('#bs-show-original').prop('checked', hasOpenOriginalVerses());
    return hasOpenOriginalVerses();
  }

  function updateOriginalPanelsVisibility() {
    $('.bible-study-original-row').each(function() {
      var verseKey = String($(this).data('verse') || '');
      $(this).toggle(!!bsOriginalOpenVerses[verseKey]);
    });
  }

  function loadBibleStudyOriginalText(state) {
    if (!state.showOriginalText) {
      $('.bible-study-original-row').remove();
      return;
    }
    ensureOriginalTextPanels(state);
    updateOriginalPanelsVisibility();
    fetchBibleStudyOriginalRange(state, function(payload, errorMessage) {
      var currentState = currentBibleStudyState();
      if (bibleStudyRangeKey('', state.book, state.chapter, state.startVerse, state.endVerse) !==
          bibleStudyRangeKey('', currentState.book, currentState.chapter, currentState.startVerse, currentState.endVerse)) {
        return;
      }
      if (!payload) {
        $('.bible-study-original-row .bs-original-sentence, .bible-study-original-row .bs-original-word-detail')
          .empty().append($('<p class="text-danger" role="alert"></p>').text(errorMessage));
        $('.bible-study-original-row .bs-original-word-cloud').empty();
        return;
      }
      applyBibleStudyOriginalPayloadToDom(state, payload);
      updateOriginalPanelsVisibility();
      syncBibleStudyOriginalToggleButtons();
    });
  }

  function fetchBibleStudyRange(state, bible, onDone) {
    var requestKey = bibleStudyRangeKey(bible.id, state.book, state.chapter, state.startVerse, state.endVerse);
    if (bibleStudyRequestCache[requestKey]) {
      window.setTimeout(function() {
        onDone(bibleStudyRequestCache[requestKey]);
      }, 60);
      return;
    }

    $.ajax({
      type: 'POST',
      url: bibleStudyVersesUrl(),
      timeout: 20000,
      dataType: 'json',
      data: {
        csrfmiddlewaretoken: (document.cookie.match(/csrftoken=([^;]+)/) || [null, ''])[1] || '',
        bible_id: bible.id,
        book: state.book,
        chapter: state.chapter,
        start_verse: state.startVerse,
        end_verse: state.endVerse
      },
      success: function(payload) {
        bibleStudyRequestCache[requestKey] = payload || {};
        onDone(payload || {});
      },
      error: function() {
        onDone({ verses: {}, bible_display_name: bible.displayName, copyright: bible.copyright || '' });
      }
    });
  }

  function seedBibleStudyRequestCache() {
    {% if selected_bibles %}
    var initialState = {
      book: '{{ selected_book|escapejs }}',
      bookLabel: '{{ selected_book_label|escapejs }}',
      chapter: {{ selected_chapter }},
      startVerse: {{ selected_start_verse }},
      endVerse: {{ selected_end_verse }},
      bibles: []
    };
    {% for bible in selected_bibles %}
    initialState.bibles.push({
      id: '{{ bible.id|escapejs }}',
      displayName: '{{ bible.display_name|escapejs }}',
      copyright: '{{ bible.copyright|escapejs }}'
    });
    bibleStudyRequestCache[bibleStudyRangeKey('{{ bible.id|escapejs }}', initialState.book, initialState.chapter, initialState.startVerse, initialState.endVerse)] = {
      bible_display_name: '{{ bible.display_name|escapejs }}',
      copyright: '{{ bible.copyright|escapejs }}',
      verses: {
        {% for verse in verse_data %}'{{ verse.verse_num }}': '{{ bible.verse_texts|get_item:verse.verse_num|default:""|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}
      },
      verse_sources: {
        {% for verse in verse_data %}'{{ verse.verse_num }}': '{{ bible.verse_sources|get_item:verse.verse_num|default:"cache"|escapejs }}'{% if not forloop.last %}, {% endif %}{% endfor %}
      }
    };
    {% endfor %}
    {% endif %}
  }

  function hideBibleSelectorImmediately(slot) {
    var $col = $('#bs-col-' + slot);
    var $select = $('#bs-bible-' + slot);
    resetSelectOptions($select);
    setPickerValue($select, '');
    $select.prop('disabled', true);
    ensureSelectpicker($select);
    $col.hide();
  }

  function enforceBibleSlotLimit() {
    var limit = effectiveMaxBibleSlots();
    for (var slot = 4; slot > limit; slot -= 1) {
      hideBibleSelectorImmediately(slot);
    }
    refreshBibleSlots();
  }

  function refreshBibleSlots() {
    var limit = effectiveMaxBibleSlots();
    var $eligibleCols = $('.bs-bible-selector-col').filter(function() {
      return parseInt(String(this.id).replace('bs-col-', ''), 10) <= limit;
    });
    var $visibleCols = $eligibleCols.filter(':visible');
    var hasHiddenSlots = $eligibleCols.filter(':hidden').length > 0;

    $('.bs-add-bible-inline').hide();
    if (hasHiddenSlots && $visibleCols.length) {
      $visibleCols.last().find('.bs-add-bible-inline').css('display', 'inline-flex');
    }

    $('.bs-remove-bible').each(function() {
      var slot = parseInt($(this).data('col'), 10) || 0;
      $(this).toggle(slot <= limit && $visibleCols.length > 1);
    });
  }

  function ensureSelectpicker($select) {
    if ($select.length && $.fn.selectpicker) {
      $select.closest('.bible-study-select-wrap').removeClass('native-combo-enabled');
      $select.siblings('.native-combo-input, .native-combo-datalist, .bs-native-combo-menu').remove();
      if ($select.data('selectpicker')) {
        $select.selectpicker('refresh');
      } else {
        $select.selectpicker({
          liveSearch: true,
          size: 10
        });
      }
      return;
    }

    if (!$select.length) {
      return;
    }

    var selectId = String($select.attr('id') || '');
    if (!selectId) {
      return;
    }

    var $wrap = $select.closest('.bible-study-select-wrap');
    var $input = $select.siblings('.native-combo-input[data-select-id="' + selectId + '"]');
    var $menu = $select.siblings('.bs-native-combo-menu[data-select-id="' + selectId + '"]');

    function closeNativeComboMenu() {
      $wrap.removeClass('native-combo-open');
      $menu.removeClass('is-open');
      syncNativeComboInput();
    }

    function refreshNativeComboMenu(filterText) {
      var typed = filterText;
      if (typeof typed === 'undefined') {
        typed = $input.val();
      }
      typed = $.trim(String(typed || '')).toLowerCase();
      var selectedValue = String($select.val() || '');
      var items = [];

      $select.find('option').each(function() {
        var optionValue = String($(this).val() || '');
        var label = $.trim($(this).text());
        if (!optionValue || !label) {
          return;
        }
        if (typed && label.toLowerCase().indexOf(typed) === -1) {
          return;
        }

  function rebuildSelectOptions($select, query) {

    $select.empty();

      if (!matchesQuery && optionData.value !== '') {

      var $option = $('<option></option>').val(optionData.value).text(optionData.text);
      if (!firstMatchValue && optionData.value && matchesQuery) {
        firstMatchValue = optionData.value;
      }
      $select.append($option);

    if (normalizedQuery) {
      setPickerValue($select, firstMatchValue || '');

  function bibleStudyNormalizeBookKey(book) {
    return String(scripturaBookName(book) || book || '').toLowerCase().replace(/[^a-z0-9]/g, '');

  function bibleStudyCommentatorSupportsBook(commentator, book) {
    var normalizedBook = bibleStudyNormalizeBookKey(book);
    var isOtBook = isOtBibleStudyBook(book);

    if (isOtBook && commentator && commentator.supports_old_testament === false) {
      return false;
    }
    if (!isOtBook && commentator && commentator.supports_new_testament === false) {
      return false;
    }

    var availableBookKeys = Array.isArray(commentator && commentator.available_book_keys)
      ? commentator.available_book_keys.map(function(item) {
          return bibleStudyNormalizeBookKey(item);
        }).filter(function(item) {
          return !!item;
        })
      : [];

    if (availableBookKeys.length > 0 && normalizedBook) {
      return availableBookKeys.indexOf(normalizedBook) !== -1;
    }

    return true;
  }

  function bibleStudyHasScripturaCommentators(book) {
    var selectedBook = String(book || currentBibleStudyState().book || '');
    var isOtBook = isOtBibleStudyBook(selectedBook);
    var $shell = $('.bible-study-shell');
    var disabled = String($shell.data('scriptura-disabled-commentators') || '')
      .split(',')
      .map(function(item) { return $.trim(String(item || '').toLowerCase()); })
      .filter(function(item) { return item.length > 0; });
    var disabledLookup = {};
    disabled.forEach(function(item) {
      disabledLookup[item] = true;
    });

    var languageCode = String($shell.data('commentary-language') || '').toLowerCase().slice(0, 2);
    var davidSternAvailable = String($shell.data('david-stern-commentary-available') || '') === '1';
    var hasBuiltIn = (!isOtBook && davidSternAvailable && !disabledLookup['david-stern']) ||
      (languageCode === 'nl' && !disabledLookup['matthew-henry']);
    if (hasBuiltIn) {
      return true;
    }

    var $body = $('body');
    if (String($body.data('sword-commentary-enabled') || '') !== '1') {
      return false;
    }

    var rawSword = String($body.attr('data-sword-commentators') || '').trim();
    if (!rawSword) {
      return false;
    }

    try {
      var swordCommentators = JSON.parse(rawSword);
      if (!Array.isArray(swordCommentators)) {
        return false;
      }
      return swordCommentators.some(function(commentator) {
        var commentatorId = $.trim(String((commentator && commentator.id) || '').toLowerCase());
        return commentatorId && !disabledLookup[commentatorId] && bibleStudyCommentatorSupportsBook(commentator, selectedBook);
      });
    } catch (error) {
      return false;
    }
  }

    var books = bsCanonicalBookNames();
    var index = books.indexOf(String(bookName || ''));

  function bsNavigateRange(direction, step) {
    var state = currentBibleStudyState();
    var jump = Math.max(1, parseInt(step, 10) || bsMaxVersesConst || 1);
    if (direction === 'prev') {
      if (state.startVerse > 1) {
        var prevEnd = state.startVerse - 1;
        var prevStart = Math.max(1, prevEnd - jump + 1);
        bsApplyRangeAndSubmit(prevStart, prevEnd);
        return;
      }

      if (state.chapter > 1) {
        var previousChapter = state.chapter - 1;
        var preferredBibleIdPrev = bsMetaBibleId();
        bsFetchChapterMax(state.book, previousChapter, preferredBibleIdPrev, function(maxVersePrevChapter) {
          var prevChapterMax = parseInt(maxVersePrevChapter || 0, 10);
          if (!prevChapterMax) {
            return;
          }
          var prevStartInPrevChapter = Math.max(1, prevChapterMax - jump + 1);
          bsApplyTargetPassage(state.book, previousChapter, prevStartInPrevChapter, prevChapterMax);
        });
        return;
      }

      var previousBook = bsBookByOffset(state.book, -1);
      if (!previousBook) {
        return;
      }
      var previousBookChapter = bsBookChapterCount(previousBook);
      var preferredBibleIdPrevBook = bsMetaBibleId();
      bsFetchChapterMax(previousBook, previousBookChapter, preferredBibleIdPrevBook, function(maxVersePrevBook) {
        var prevBookChapterMax = parseInt(maxVersePrevBook || 0, 10);
        if (!prevBookChapterMax) {
          return;
        }
        var prevStartInPrevBook = Math.max(1, prevBookChapterMax - jump + 1);
        bsApplyTargetPassage(previousBook, previousBookChapter, prevStartInPrevBook, prevBookChapterMax);
      });
      return;
    }

    var nextStart = state.endVerse + 1;
    var preferredBibleId = bsMetaBibleId();
    bsFetchChapterMax(state.book, state.chapter, preferredBibleId, function(maxVerse) {
      var currentChapterMax = parseInt(maxVerse || 0, 10);
      if (currentChapterMax && nextStart <= currentChapterMax) {
        var nextEndSameChapter = Math.min(nextStart + jump - 1, currentChapterMax);
        bsApplyRangeAndSubmit(nextStart, nextEndSameChapter);
        return;
      }

      var nextBook = state.book;
      var nextChapter = state.chapter + 1;
      if (nextChapter > bsBookChapterCount(state.book)) {
        nextBook = bsBookByOffset(state.book, 1);
        nextChapter = 1;
      }
      if (!nextBook) {
        return;
      }

      var preferredBibleIdNext = bsMetaBibleId();
      bsFetchChapterMax(nextBook, nextChapter, preferredBibleIdNext, function(maxVerseNextChapter) {
        var nextChapterMax = parseInt(maxVerseNextChapter || 0, 10);
        if (!nextChapterMax) {
          return;
        }
        var nextEnd = Math.min(1 + jump - 1, nextChapterMax);
        bsApplyTargetPassage(nextBook, nextChapter, 1, nextEnd);
      });
    });
  }

  var shouldRestoreOriginalOnLoad = $('#bs-show-original').is(':checked') && hasInitialVerseArea;
  if (shouldRestoreOriginalOnLoad) {
    var initialState = currentBibleStudyState();
    bsOriginalOpenVerses[String((bsPendingStrongsSelection && bsPendingStrongsSelection.verse) || initialState.startVerse || 1)] = true;
    syncBibleStudyOriginalToggleButtons();
  }
  if (bsCombineVerses && hasInitialVerseArea) {
    $('#bibleStudyForm').trigger('submit');
  } else if (shouldRestoreOriginalOnLoad) {
    var initialOriginalState = currentBibleStudyState();
    initialOriginalState.showOriginalText = true;
    loadBibleStudyOriginalText(initialOriginalState);
    syncBibleStudyOriginalToggleButtons();
  } else {
    $('#bs-show-original').prop('checked', false);
  }
  if (!bsCombineVerses && hasInitialVerseArea) {
    loadBibleStudyWordAlignments(currentBibleStudyState());
  }
})(jQuery);
</script>
