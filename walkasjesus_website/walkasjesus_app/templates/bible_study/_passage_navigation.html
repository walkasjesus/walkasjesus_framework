{% load i18n %}
<div class="bs-passage-nav-shell">
  <button type="button" class="btn btn-sm commentary-action-btn bs-passage-nav-btn" data-bs-nav="prev" data-step="{{ verse_nav_step }}">
    <i class="fa fa-angle-left mr-1" aria-hidden="true"></i>{% trans 'Previous' %} {{ verse_nav_step }} {% trans 'verses' %}
  </button>
  <h5 class="bs-passage-pill">{{ selected_book_label }} {{ selected_chapter }}:{{ selected_start_verse }}{% if selected_end_verse != selected_start_verse %}&ndash;{{ selected_end_verse }}{% endif %}</h5>
  <button type="button" class="btn btn-sm commentary-action-btn bs-passage-nav-btn" data-bs-nav="next" data-step="{{ verse_nav_step }}">
    {% trans 'Next' %} {{ verse_nav_step }} {% trans 'verses' %}<i class="fa fa-angle-right ml-1" aria-hidden="true"></i>
  </button>
  {% if not license_limited_names %}
  <button type="button" class="btn btn-sm commentary-action-btn bs-passage-nav-btn bs-show-chapter-btn">
    <i class="fa fa-book mr-1" aria-hidden="true"></i>{% trans 'Show whole chapter' %}
  </button>
  {% endif %}
</div>
