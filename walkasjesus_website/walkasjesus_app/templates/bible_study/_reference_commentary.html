{% load i18n %}
<button type="button" class="btn btn-sm commentary-action-btn scriptura-commentary-btn mt-1" data-scriptura-book="{{ ref.scriptura_book }}" data-scriptura-chapter="{{ ref.scriptura_chapter }}" data-scriptura-verse="{{ ref.scriptura_verse }}"><span class="commentary-inline-icon" aria-hidden="true"><svg class="commentary-inline-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"></path></svg></span> {% trans "Other Commentary" %}</button>
<div class="scriptura-commentary-panel"></div>
{% if ref.is_ot %}
<button type="button" class="btn btn-sm sefaria-commentary-btn sefaria-commentary-btn-secondary mt-1" data-sefaria-ref="{{ ref.sefaria_reference|default:ref.display_reference }}"><img src="https://www.sefaria.org/favicon.ico" alt="Sefaria" class="commentary-favicon"> {% trans "Jewish Commentary" %}</button>
<div class="sefaria-commentary-panel"></div>
{% endif %}
